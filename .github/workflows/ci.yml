name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }} lint + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, sqlite3, curl, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PHP syntax check
        run: find api migrations tests promo-code.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: JavaScript syntax check
        run: |
          set -e
          for f in api/js/*.js api/sw.js tests/functional/esc.test.js; do node --check "$f"; done

      - name: Python syntax check
        run: python -m py_compile tests/functional/run_tests.py

      - name: Payment provider contract tests
        run: php tests/payment-provider-contract.php

      - name: Functional tests (SQLite stand-in, local PHP servers)
        run: python tests/functional/run_tests.py

  mysql-migrations:
    name: Payment migrations on MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify migrations on a disposable database
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PWD: root
        run: bash tests/migrations/run_migration_test.sh
